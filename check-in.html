<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check-In</title>
</head>
<body>

    <h1>Check-In Done</h1>

    <script>
        // Check if the ID already exists in localStorage
        var visitorId = localStorage.getItem('uniqueVisitorId');

        // If it does not exist, create a new one and save it
        if (!visitorId) {
            visitorId = 'user_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
            localStorage.setItem('uniqueVisitorId', visitorId);
        }
        // --
        const url = 'https://script.google.com/macros/s/AKfycbycY_suAt_sVKmiXMMfak5CCI0L7hNcHFhejFqibh-n3seH6swZB2SopH4hwY4ss2OmWg/exec';
        const data = new URLSearchParams({
              uuid: visitorId,
              originURL: 'value2'
        });

        fetch(url, {
        method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: data
        })
        .then(response => response.json())
        .then(result => console.log(result))
        .catch(error => console.error('Error:', error));

        // Write stuff on page
        const cardDiv = document.createElement('div');
        const heading = document.createElement('h2');
        const paragraph = document.createElement('p');
        cardDiv.className = 'card';
        heading.textContent = '----';
        paragraph.textContent = 'VisitorID ==
             + visitorID;

        cardDiv.appendChild(heading);
        cardDiv.appendChild(paragraph);
        document.getElementById('container').appendChild(cardDiv);

        // --
    </script>

</body>
</html>
