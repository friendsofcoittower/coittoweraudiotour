<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">    
    <link rel="stylesheet" href="stylesheet.css">
    <title>Check-In</title>
</head>
<body>

    <h1>Check-In Successful</h1>
    <div id="html-container"></div>

    <script>
        var date = new Date();
        var checkInDate = new Date();
        var tourEnds = new Date();
        var durationOfTourInSeconds = 30;
        tourEnds.setMinutes(date.getSeconds() + durationOfTourInSceonds);     
        localStorage.setItem('tourEnds', Math.floor(tourEnds));
        console.log("Enter time comparison, tourEnds = " + localStorage.getItem('tourEnds'));
        
        localStorage.setItem('checkInDate', Math.floor(checkInDate));
        console.log("Enter time comparison, tourStarted = " + localStorage.getItem('checkInDate'));

        var visitorId = localStorage.getItem('uniqueVisitorId');
        // If it does not exist, create a new one and save it
        if (!visitorId) {
            visitorId = 'user_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
            localStorage.setItem('uniqueVisitorId', visitorId);
        }
        
        // --
        const url = 'https://script.google.com/macros/s/AKfycbycY_suAt_sVKmiXMMfak5CCI0L7hNcHFhejFqibh-n3seH6swZB2SopH4hwY4ss2OmWg/exec';
        const data = new URLSearchParams({
              uuid: visitorId,
              tourends: tourEnds,
              test: "fssdf"
        });

        fetch(url, {
        method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: data
        })
        .then(response => response.json())
        .then(result => console.log(result))
        .catch(error => console.error('Error:', error));


        // --
        const htmlTarget = document.getElementById('html-container');
        htmlTarget.innerHTML = 'You can use the tour until ' + Date(Number(localStorage.getItem('tourEnds'))) + '<p>(TimeStamp: ' + localStorage.getItem('tourEnds') + ')' + '<p>' +
                               ' The tour currently is set up to expire after ' + durationOfTourInSeconds + ' seconds ' + '<p>' +
                                'Your time of check-in was ' + Date(Number(localStorage.getItem('checkInDate'))) + '<p>' +  
                                'Your unique Visitor ID for this tour is ' + localStorage.getItem('uniqueVisitorId') + '<p>';

    </script>

</body>
</html>
