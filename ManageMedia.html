<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <link rel="stylesheet" href="stylesheet.css">
    <title>Manage Media</title>
</head>
<body>
    <p> </p>
<div class="audio-player">
  
  <!-- Playback Buttons -->
  <button id="playBtn">Play</button>
  <button id="pauseBtn">Pause</button>
  
  <!-- Progress Tracker -->
  <div class="control-group">
    <label for="progressBar">Progress:</label>
    <input type="range" id="progressBar" min="0" value="0" step="0.1">
    <span id="timeDisplay">0:00 / 0:00</span>
  </div>
  
  <!-- Volume Slider -->
  <div class="control-group">
    <label for="volumeSlider">Volume:</label>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
  </div>
  
  
</div>

  <script>
    
        // Check if the ID already exists in localStorage
      var visitorId = localStorage.getItem('uniqueVisitorId');
      var tourEnds = localStorage.getItem('tourEnds');
      // Get the query string from the URL
      const queryString = window.location.search;
      // Parse the parameters safely
      const urlParams = new URLSearchParams(queryString);
      // Get a specific value (automatically decoded)
      const selectedMedia = urlParams.get('selectedMedia'); 

       const audio = new Audio(selectedMedia + ".mp3");      

      // const audio = new Audio("Animal_Force_and_Machine_Force.mp3");
      const playBtn = document.getElementById("playBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const volumeSlider = document.getElementById("volumeSlider");
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

     function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
       return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      audio.addEventListener("loadedmetadata", () => {
          progressBar.max = audio.duration; // Match slider length to audio track duration
          timeDisplay.textContent = `0:00 / ${formatTime(audio.duration)}`;
      });

      audio.addEventListener("timeupdate", () => {
          progressBar.value = audio.currentTime; // Move slider thumb to current time position
      timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;  
      });

      progressBar.addEventListener("input", (event) => {
          audio.currentTime = event.target.value; // Snap song position to user selection
      });

      playBtn.addEventListener("click", () => {
          audio.play().catch(err => console.log("Interaction required first", err));
      });

      pauseBtn.addEventListener("click", () => {
        audio.pause();
      });

      volumeSlider.addEventListener("input", (event) => {
        audio.volume = event.target.value; 
      });
      if (visitorId == null) {
        window.location.replace("NotAuth.html");
      }
      var now = new Date();
      console.log("Enter time comparison, now = " + now.getTime());
      console.log("Enter time comparison, tourEnds = " + tourEnds);
      if (tourEnds > now.getTime())) {
        console.log("Tour has expired")
        window.location.replace("TourExpired.html");
      } else {
                console.log("Tour is ongoing");
      }

    </script>

</body>
</html>
