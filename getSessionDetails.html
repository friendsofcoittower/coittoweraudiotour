<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">    
    <link rel="stylesheet" href="stylesheet.css">
    <title>Session Details</title>
</head>
<body>

    <h1>Session Details</h1>
    <div id="html-container"></div>

    <script>
 
        const tourEnds = localStorage.getItem('tourEnds');        
        const checkInDate = localStorage.getItem('checkInDate');
        const visitorId = localStorage.getItem('uniqueVisitorId');
        const tourEndsObj = new Date(tourEnds);
        const checkInDateObj = new Date(checkInDate);
    
        const htmlTarget = document.getElementById('html-container');
        htmlTarget.innerHTML =  'Your unique Visitor ID for this tour is ' + visitorId + '<p>' +
                                'Start ' +  checkInDateObj  + '<p>' +
                                'End ' +  tourEndsObj  + '<p>';
           
    </script>

</body>
</html>
