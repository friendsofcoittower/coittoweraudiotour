<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unique Visitor ID</title>
</head>
<body>

    <h1>Welcome to My Page</h1>

    <script>
        // Check if the ID already exists in localStorage
        let visitorId = localStorage.getItem('uniqueVisitorId');

        // If it does not exist, create a new one and save it
        if (!visitorId) {
            visitorId = 'user_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
            localStorage.setItem('uniqueVisitorId', visitorId);
            persistRequestDataStringURL ="https://script.google.com/macros/s/AKfycbycY_suAt_sVKmiXMMfak5CCI0L7hNcHFhejFqibh-n3seH6swZB2SopH4hwY4ss2OmWg/exec?uuid=" + visitorID;
            fetch(persistRequestDataStringURL) .then(response => {
            if (!response.ok) throw new Error('Network error');
                return response.json();
          })
          .then(data => console.log(data))
          .catch(error => console.error('Error:', error));

    </script>

</body>
</html>
