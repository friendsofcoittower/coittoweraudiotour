<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Check-Ins Cleared</title>
</head>
<body>

    <h1>Check-In Cleared</h1>
    <div id="container"></div>
    <script>
        // Check if the ID already exists in localStorage
        var visitorId = localStorage.getItem('uniqueVisitorId');
        localStorage.clear();
        // Target the existing container element

// 1. Create the elements
const cardDiv = document.createElement('div');
const heading = document.createElement('h2');
const paragraph = document.createElement('p');

// 2. Add attributes and text content
cardDiv.className = 'card';
heading.textContent = 'Hello World';
paragraph.textContent = 'This HTML was built securely using DOM methods.';

// 3. Nest the elements inside each other
cardDiv.appendChild(heading);
cardDiv.appendChild(paragraph);

// 4. Inject the final element into the page
document.getElementById('container').appendChild(cardDiv);


    </script>

</body>
</html>
